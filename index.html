<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Homes - Property Assistant</title>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; flex-direction: column; background: #f4f4f4; }
        .header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 15px; text-align: center; flex-shrink: 0; z-index: 10; }
        .header h1 { margin: 0; font-size: 22px; }
        .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; font-style: italic; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; background: #fff; }
        .msg { margin: 10px 0; padding: 10px 14px; border-radius: 12px; max-width: 80%; line-height: 1.5; font-size: 15px; }
        .user { background: #1a237e; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .bot { background: #e8eaf6; color: #333; border-bottom-left-radius: 4px; }
        
        .controls { flex-shrink: 0; padding: 8px 10px; background: white; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid #ddd; }
        .quick-btn { background: #fff; border: 1px solid #1a237e; color: #1a237e; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .quick-btn:hover { background: #1a237e; color: white; }
        
        .input-area { flex-shrink: 0; display: flex; padding: 10px; background: white; border-top: 1px solid #eee; }
        .input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 15px; }
        .icon-btn { background: #1a237e; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; margin-left: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        
        #previewContainer { flex-shrink: 0; padding: 5px 10px; display: none; background: #fff; border-top: 1px solid #eee; }
        #previewImg { max-width: 100px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 Global Homes</h1>
        <p>"Aapka Sapna, Hamari Zimmedari"</p>
    </div>
    
    <div class="chat-box" id="chat">
        <div class="msg bot">Namaste! 🙏 Main Global Homes ka AI Assistant hoon. Aap kaisi property dhundh rahe hain? (Budget, Location, BHK batayein)</div>
    </div>

    <div id="previewContainer">
        <img id="previewImg" alt="Preview">
    </div>
    
    <div class="controls">
        <button class="quick-btn" onclick="sendQuick('2BHK Andheri mein kitne ka hai?')">🏠 2BHK Andheri</button>
        <button class="quick-btn" onclick="sendQuick('Mera budget 50 lakh hai')">💰 50 Lakh Budget</button>
        <button class="quick-btn" onclick="sendQuick('3BHK Bandra')">🏙️ 3BHK Bandra</button>
        <button class="quick-btn" onclick="sendQuick('Site visit book karni hai')">📅 Site Visit</button>
    </div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Apna sawaal likhein..." onkeypress="if(event.key==='Enter')send()">
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📷</button>
        <button class="icon-btn" onclick="send()" style="border-radius: 20px; width: auto; padding: 0 15px;">Send</button>
    </div>

<script>
    let selectedImageBase64 = null;
    let selectedImageMime = null;

    document.getElementById('imageInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            selectedImageMime = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result.split(',')[1];
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    async function getReply(text) {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                message: text,
                image: selectedImageBase64,
                mimeType: selectedImageMime
            })
        });
        const data = await response.json();
        return data.reply;
    }

    async function send() {
        const input = document.getElementById('input').value;
        const hasImage = selectedImageBase64 !== null;
        if(!input && !hasImage) return;
        
        const chat = document.getElementById('chat');
        if(input) chat.innerHTML += `<div class="msg user">${input}</div>`;
        if(hasImage) chat.innerHTML += `<div class="msg user">📷 [Image]</div>`;
        document.getElementById('input').value = '';
        selectedImageBase64 = null;
        selectedImageMime = null;
        document.getElementById('previewImg').src = '';
        document.getElementById('previewContainer').style.display = 'none';

        const typingMsg = document.createElement('div');
        typingMsg.className = 'msg bot';
        typingMsg.innerText = 'Typing...';
        typingMsg.id = 'typingIndicator';
        chat.appendChild(typingMsg);
        chat.scrollTop = chat.scrollHeight;
        
        try {
            const reply = await getReply(input);
            document.getElementById('typingIndicator').remove();
            chat.innerHTML += `<div class="msg bot">${reply}</div>`;
        } catch (error) {
            document.getElementById('typingIndicator').remove();
            chat.innerHTML += `<div class="msg bot">Error! Kuch galat ho gaya.</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }

    function sendQuick(text) { 
        document.getElementById('input').value = text; send(); 
    }
</script>
</body>
</html>
